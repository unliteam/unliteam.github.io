<html lang="ru">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>software</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #C0C0C0;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40"><rect width="40" height="40" fill="%23C0C0C0"/><rect width="20" height="20" fill="%23B0B0B0" opacity="0.3"/><rect x="20" y="20" width="20" height="20" fill="%23B0B0B0" opacity="0.3"/></svg>');

            font-size: 13px;
            padding: 20px 10px;
            margin: 0;
            color: #1E1E1E;
        }

        .window-wrapper {
            max-width: 960px;
            margin: 0 auto;
            background: #ECE9D8;
            border: 3px ridge #FFFFFF;
            border-color: #FFFFFF #808080 #808080 #FFFFFF;
            padding: 6px 8px 8px 8px;
            box-shadow: 6px 6px 12px rgba(0,0,0,0.4);
        }

        .window-titlebar {
            background: #0A246A;
            background: linear-gradient(90deg, #0A246A 0%, #3A6EA5 100%);
            padding: 4px 6px 4px 10px;
            margin: -6px -8px 8px -8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            font-weight: bold;
            font-size: 13px;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #808080;
        }

        .window-titlebar span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .win-buttons {
            display: flex;
            gap: 4px;
        }

        .win-buttons button {
            background: #C0C0C0;
            border: 2px outset #FFFFFF;
            border-color: #FFFFFF #808080 #808080 #FFFFFF;
            width: 22px;
            height: 22px;
            font-size: 12px;
            font-weight: bold;
            color: #1E1E1E;
            line-height: 16px;
            text-align: center;
            cursor: pointer;
            padding: 0;
        }

        .win-buttons button:active {
            border-color: #808080 #FFFFFF #FFFFFF #808080;
            padding: 1px 0 0 1px;
        }

        .tabs-container {
            margin: 0 0 12px 0;
            border-bottom: 2px solid #808080;
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
            padding: 0 4px;
            background: #D4D0C8;
        }

        .tab-btn {
            background: #D4D0C8;
            border: 2px solid #808080;
            border-bottom: none;
            border-color: #FFFFFF #808080 #808080 #FFFFFF;
            padding: 6px 18px 4px 18px;
            font-family: "Tahoma", sans-serif;
            font-size: 12px;
            font-weight: bold;
            color: #1E1E1E;
            cursor: pointer;
            position: relative;
            top: 2px;
            margin-right: 2px;
            border-top-left-radius: 4px;
            border-top-right-radius: 4px;
            transition: background 0.1s;
            text-shadow: 1px 1px 0 #F0F0F0;
        }

        .tab-btn.active {
            background: #ECE9D8;
            border-color: #FFFFFF #808080 #808080 #ECE9D8;
            border-bottom: 2px solid #ECE9D8;
            top: 2px;
            padding-bottom: 5px;
            color: #000080;
            text-shadow: 1px 1px 0 #FFFFFF;
        }

        .tab-btn:hover {
            background: #E3DFD6;
        }

        .search-area {
            background: #E3DFD6;
            border: 2px inset #FFFFFF;
            border-color: #808080 #FFFFFF #FFFFFF #808080;
            padding: 8px 10px;
            margin: 0 0 14px 0;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 12px;
        }

        .search-area label {
            font-weight: bold;
            font-size: 12px;
            color: #1E1E1E;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .search-area input[type="text"] {
            background: #FFFFFF;
            border: 2px inset #808080;
            border-color: #808080 #FFFFFF #FFFFFF #808080;
            padding: 4px 6px;
            font-family: "Tahoma", sans-serif;
            font-size: 12px;
            width: 200px;
            height: 26px;
            outline: none;
            color: #1E1E1E;
        }

        .search-area input[type="text"]:focus {
            border-color: #0A246A #FFFFFF #FFFFFF #0A246A;
        }

        .search-area button {
            background: #D4D0C8;
            border: 2px outset #FFFFFF;
            border-color: #FFFFFF #808080 #808080 #FFFFFF;
            padding: 4px 18px;
            font-family: "Tahoma", sans-serif;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            color: #1E1E1E;
            height: 28px;
        }

        .search-area button:active {
            border-color: #808080 #FFFFFF #FFFFFF #808080;
            padding: 5px 17px 3px 19px;
        }

        .software-table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid #999999;
            background: #FFFFFF;
            margin-top: 4px;
        }

        .software-table th {
            background: #D6D3CE;
            border: 1px solid #FFFFFF;
            border-bottom: 2px solid #808080;
            border-right: 2px solid #808080;
            padding: 6px 8px;
            text-align: left;
            font-size: 12px;
            font-weight: bold;
            color: #1E1E1E;
        }

        .software-table th:last-child {
            border-right: 1px solid #FFFFFF;
        }

        .app-row {
            background: #F5F5F5;
            border-bottom: 1px solid #CCCCCC;
        }

        .app-row:nth-child(even) {
            background: #FFFFFF;
        }

        .app-cell {
            padding: 8px 6px;
            vertical-align: top;
        }

        .icon-col {
            width: 44px;
            text-align: center;
        }

        .app-icon {
            width: 36px;
            height: 36px;
            background: #008080;
            border: 2px outset #FFFFFF;
            border-color: #FFFFFF #808080 #808080 #FFFFFF;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #FFFFFF;
            font-weight: bold;
            font-size: 18px;
            font-family: "Tahoma", sans-serif;
            text-shadow: 1px 1px 0 #004040;
            box-shadow: 1px 1px 0 #404040;
        }

        .app-title {
            font-size: 14px;
            font-weight: bold;
            color: #004E98;
            margin: 0 0 4px 0;
            letter-spacing: 0.3px;
        }

        .app-desc {
            font-size: 12px;
            line-height: 1.4;
            color: #222222;
            margin: 0;
        }

        .actions-col {
            width: 150px;
            text-align: center;
            vertical-align: middle;
        }

        .btn {
            display: block;
            width: 120px;
            margin: 4px auto;
            padding: 3px 0;
            font-size: 11px;
            font-family: "Tahoma", sans-serif;
            font-weight: bold;
            text-decoration: none;
            text-align: center;
            color: #1E1E1E;
            background: #E0DFE3;
            border-top: 2px solid #FFFFFF;
            border-left: 2px solid #FFFFFF;
            border-right: 2px solid #808080;
            border-bottom: 2px solid #808080;
            cursor: pointer;
            transition: 0.05s linear;
        }

        .btn:active {
            border-top: 2px solid #808080;
            border-left: 2px solid #808080;
            border-right: 2px solid #FFFFFF;
            border-bottom: 2px solid #FFFFFF;
            padding: 4px 0 2px 0;
        }

        .btn-download {
            background: #D4E2EE;
            color: #004E98;
            border-color: #FFFFFF #808080 #808080 #FFFFFF;
        }

        .footer {
            margin-top: 16px;
            border-top: 2px groove #C0C0C0;
            padding: 8px 4px 4px 4px;
            text-align: center;
            color: #444444;
            font-size: 11px;
            font-family: "Tahoma", sans-serif;
        }

        .footer a {
            color: #0000A0;
            text-decoration: underline;
        }

        .footer a:hover {
            color: #CC0000;
            text-decoration: none;
        }

        @media (max-width: 700px) {
            .search-area {
                flex-direction: column;
                align-items: stretch;
            }
            .search-area input[type="text"] {
                width: 100%;
            }
            .actions-col {
                width: 120px;
            }
            .btn {
                width: 100px;
            }
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .tab-btn::before {
            content: "📄 ";
            font-size: 13px;
        }
        .tab-btn[data-tab="tab1"]::before { content: " "; }
        .tab-btn[data-tab="tab2"]::before { content: " "; }
        .tab-btn[data-tab="tab3"]::before { content: " "; }
        .tab-btn[data-tab="tab4"]::before { content: " "; }

        .tab-btn[data-tab="tab12"]::before { content: " "; }
    </style>
</head>

        function getIconLetter(name) {
            return name.charAt(0).toUpperCase();
        }

        function buildTableRows(filteredData, searchText = '') {
            let html = '';
            filteredData.forEach(prog => {
                if (searchText && !prog.name.toLowerCase().includes(searchText.toLowerCase()) && 
                    !prog.desc.toLowerCase().includes(searchText.toLowerCase())) {
                    return;
                }
                const letter = getIconLetter(prog.name);
                html += `
                    <tr class="app-row">
                        <td class="app-cell icon-col"><div class="app-icon">${letter}</div></td>
                        <td class="app-cell">
                            <div class="app-title">${prog.name}</div>
                            <p class="app-desc">${prog.desc}</p>
                        </td>
                        <td class="app-cell actions-col">
                            <a href="${prog.download || '#'}" class="btn btn-download">СКАЧАТЬ</a>
                        </td>
                    </tr>
                `;
            });
            return html;
        }

        function filterByCategory(category, searchText = '') {
            const filtered = programData.filter(p => p.category === category);
            return buildTableRows(filtered, searchText);
        }

        function filterAll(searchText = '') {
            return buildTableRows(programData, searchText);
        }

        function renderAllTabs(searchText = '') {
            document.getElementById('mainTableBody').innerHTML = filterAll(searchText);

            const tabMap = {
                tab2: 'Звук',
                tab3: 'Графика',
                tab4: 'Интернет',
                tab5: 'Диск и файлы',
                tab6: 'Мониторинг',
                tab7: 'Source Engine',
                tab8: 'Разработка',
                tab9: 'Утилиты',
                tab10: 'Офис',
                tab11: 'Драйверы & Системные утилиты',
                tab12: 'Видео',
            };

            Object.keys(tabMap).forEach(tabId => {
                const container = document.getElementById(tabId + 'content');
                const category = tabMap[tabId];
                const filtered = programData.filter(p => p.category === category);
                let html = `<p style="padding:10px 0; font-style:italic; color:#444;">${category}: ${filtered.map(p => p.name).join(', ')}</p>`;
                html += `<table class="software-table"><thead><tr><th colspan="2">Название и описание</th><th>Действия</th></tr></thead><tbody>`;
                filtered.forEach(prog => {
                    if (searchText && !prog.name.toLowerCase().includes(searchText.toLowerCase()) && 
                        !prog.desc.toLowerCase().includes(searchText.toLowerCase())) {
                        return;
                    }
                    const letter = getIconLetter(prog.name);
                    html += `
                        <tr class="app-row">
                            <td class="app-cell icon-col"><div class="app-icon">${letter}</div></td>
                            <td class="app-cell"><div class="app-title">${prog.name}</div><p class="app-desc">${prog.desc}</p></td>
                            <td class="app-cell actions-col"><a href="${prog.download || '#'}" class="btn btn-download">СКАЧАТЬ</a></td>
                        </tr>
                    `;
                });
                html += `</tbody></table>`;
                container.innerHTML = html;
            });
        }

        const tabs = document.querySelectorAll('.tab-btn');
        const contents = {
            tab1: document.getElementById('tab1'),
            tab2: document.getElementById('tab2'),
            tab3: document.getElementById('tab3'),
            tab4: document.getElementById('tab4'),
            tab5: document.getElementById('tab5'),
            tab6: document.getElementById('tab6'),
            tab7: document.getElementById('tab7'),
            tab8: document.getElementById('tab8'),
            tab9: document.getElementById('tab9'),
            tab10: document.getElementById('tab10'),
            tab11: document.getElementById('tab11'),
            tab12: document.getElementById('tab12'),
        };

        let currentTab = 'tab1';

        function switchTab(tabId) {
            Object.keys(contents).forEach(key => {
                contents[key].classList.toggle('active', key === tabId);
            });
            tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === tabId));
            currentTab = tabId;
            const searchText = document.getElementById('searchInput').value.trim();
            renderAllTabs(searchText);
        }

        tabs.forEach(tab => {
            tab.addEventListener('click', function() {
                switchTab(this.dataset.tab);
            });
        });

        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const resetBtn = document.getElementById('resetSearchBtn');

        function doSearch() {
            const searchText = searchInput.value.trim();
            renderAllTabs(searchText);
        }

        searchBtn.addEventListener('click', doSearch);
        searchInput.addEventListener('keyup', function(e) {
            if (e.key === 'Enter') doSearch();
        });

        resetBtn.addEventListener('click', function() {
            searchInput.value = '';
            doSearch();
        });

        renderAllTabs('');
    })();
</script>
